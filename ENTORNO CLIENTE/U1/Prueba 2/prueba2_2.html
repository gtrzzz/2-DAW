<!doctype html>
<html>
  <body>
    <h1>Ejercicio 2</h1>
    <p>Capturando el evento clic de un botón</p>
    <button type="button" onclick="console.log('Se ha pulsado el botón')">
      ¡Dale!
    </button>
    <!--Ejercicio 2: Implementar una página que capture el evento clic de un botón
  para emitir una traza informativa a las herramientas de desarrollo mediante console.log().-->

    <!--Ejercicio 3: Modificar el ejercicio anterior sustituyendo la escritura en el párrafo 
    por ventanas de aviso emergentes modales utilizando el método window.alert() / alert().-->
    <button type="button" onclick="alert('Se ha pulsado el botón')">
      ¡Dale al segundo botón!
    </button>
  </body>
</html>
