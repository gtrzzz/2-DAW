<!DOCTYPE html>
  <head>
    <title>Ejemplo 1</title>
    <meta charset="UTF-8">

  </head>

  <body>

    <ul> <!-- Lista sin orden, como es una lista se usa siempre el li dentro para cada uno de los elementos de la lista-->
      <h1>Lista sin orden</h1>
      <li>Elemento 1</li>
      <li>Elemento 2</li>
      <li>Elemento 3</li>
    </ul>

    <ol type="A", start="5"> <!--En las listas ordenadas se indica el tipo de lista (en este caso es lista tipo a,b,c)
      El start indica la posición desde la que empieza la lista, en este caso desde la e-->
      <h1>Lista ordenada</h1>
      <li>Elemento ordenado 1</li>
      <li>Elemento ordenado 2</li>
      <li>Elemento ordenado 3</li>

    </ol>

  </body>

</html>
