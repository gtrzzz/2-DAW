<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form>
      <fieldset>
        <legend>Datos personales</legend>
        <label for="nombre">Nombre y apellidos: </label>
        <input id="nombre" type="text" /><br />

        <label for="sexo">Sexo: </label>
        <select id="sexo">
          <!--Etiqueta option-->
          <option value="value1">Hombre</option>
          <option value="value2" selected>Mujer</option></select
        ><br /><br />

        <label>Edad: </label>
        <input type="checkbox" value="20-39" /> 20-39
        <input type="checkbox" value="40-59" /> 40-59
        <input type="checkbox" value="60-79" /> 60-79<br /><br />

        <label for="email">Email: </label>
        <input id="email" type="email" /><br /><br />

        <label for="estudios">Estudios: </label>
        <select id="estudios">
          <optgroup label="Estudios Universitarios">
            <option>Doctorado</option>
            <option>Máster</option>
            <option>Grado</option>
          </optgroup>
          <optgroup label="Ciclo Formativo">
            <option>Grado Superior</option>
            <option>Grado Medio</option>
          </optgroup></select
        ><br /><br />

        <label for="navegador">Elige tu navegador favorito: </label>
        <input id="navegador" list="browsers" />
        <datalist id="browsers">
          <option value="Chrome"></option>
          <option value="Firefox"></option>
          <option value="Internet Explorer"></option>
          <option value="Opera"></option>
          <option value="Safari"></option>
          <option value="Microsoft Edge"></option></datalist
        ><br /><br />

        <label for="mensaje">Escribe tu mensaje: </label>
        <textarea
          rows="10"
          cols="50"
          placeholder="Mensaje"
          id="mensaje"
        ></textarea>
      </fieldset>
      <input type="submit" value="Enviar" />
    </form>

    <h1>Formulario prueba</h1>
    <form>
      <fieldset>
        <legend>Asignatura</legend>
        <label for="asignatura">Nombre de la asignatura: </label>
        <input id="asignatura" type="text" />

        <legend>Hora:</legend>
        <select id="hora">
          <optgroup label="Horario de mañana">
            <option>8:15 (Primera)</option>
            <option>9:15 (Segunda)</option>
            <option>10:15 (Tercera)</option>
            <option>11:45 (Cuarta)</option>
            <option>12:45 (Quinta)</option>
            <option>13:45 (Sexta)</option>
          </optgroup>
          <optgroup label="Horario de tarde">
            <option>15:45 (Primera)</option>
            <option>16:45 (Segunda)</option>
            <option>17:45 (Tercera)</option>
            <option>19:00 (Cuarta)</option>
            <option>20:00 (Quinta)</option>
            <option>21:00 (Sexta)</option>
          </optgroup>
        </select>

        <legend>Curso:</legend>
        <input type="checkbox" value="2026-27" />2026-27
        <br />
        <input type="checkbox" value="2027-28" />2027-28
        <br />

        <label for="asignaturas">Elige tu asignatura: </label>
        <input id="asignatura" list="asignaturas" /><datalist id="asignaturas">
          <option value="DIWEB"></option>
          <option value="DWES"></option>
          <option value="DWEC"></option>
          <option value="Inglés"></option>
          <option value="IPE"></option>
          <option value="WORDPRESS"></option></datalist
        ><br /><br />
      </fieldset>
    </form>
  </body>
</html>
