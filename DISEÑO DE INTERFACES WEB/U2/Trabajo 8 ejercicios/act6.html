<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>404 – Fuera de pista</title>
    <style>
      /* 1. Animación de entrada del título */
      @keyframes flotar {
        0% {
          transform: translateY(8px);
          opacity: 0;
        }
        100% {
          transform: translateY(0);
          opacity: 1;
        }
      }
      /* 2. Estilo general */
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #000;
        color: white;
        margin: 0;
      }
      h1 {
        font-size: 4rem;
        margin: 0;
        color: #d5001c;
        animation: flotar 1.5s ease-out forwards;
      }
      /* 3. Enlace tipo botón */
      a {
        margin-top: 1.5rem;
        font-size: 1.2rem;
        text-decoration: none;
        border: 1px solid white;
        padding: 0.6rem 1.2rem;
        color: white;
        transition: background 0.3s;
      }
      a:hover,
      a:focus {
        background: #d5001c;
        border-color: #d5001c;
      }
    </style>
  </head>
  <body>
    <h1>404</h1>
    <p>Esta página se ha salido de la pista</p>
    <a href="act1.html">Volver a boxes</a>
  </body>
</html>
