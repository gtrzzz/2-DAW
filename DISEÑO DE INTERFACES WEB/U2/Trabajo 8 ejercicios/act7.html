<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Modelos Porsche</title>
    <style>
      /* 1. Estilo general */
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 1rem;
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(3, 1fr);
      }
      /* 2. Tarjetas */
      .card {
        background-color: white;
        border: 2px solid;
        border-top-width: 6px;
        padding: 1rem;
      }
      /* 3. Color según categoría */
      [data-category="deportivo"] {
        border-color: #d5001c;
      }
      [data-category="eléctrico"] {
        border-color: #0061a8;
      }
      [data-category="suv"] {
        border-color: #000;
      }
      .precio {
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <article class="card" data-category="deportivo">
      <h2>Porsche 911 Carrera</h2>
      <p class="precio">Desde 140.000 €</p>
      <p>El deportivo clásico con motor bóxer trasero.</p>
    </article>

    <article class="card" data-category="eléctrico">
      <h2>Porsche Taycan</h2>
      <p class="precio">Desde 100.000 €</p>
      <p>Berlina 100 % eléctrica con carga rápida.</p>
    </article>

    <article class="card" data-category="suv">
      <h2>Porsche Cayenne</h2>
      <p class="precio">Desde 95.000 €</p>
      <p>SUV de cinco plazas con alma deportiva.</p>
    </article>
  </body>
</html>
