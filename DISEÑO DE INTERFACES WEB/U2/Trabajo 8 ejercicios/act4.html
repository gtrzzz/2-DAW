<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Galería Porsche</title>
    <style>
      /* 1. Estilo general */
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        margin: 1rem;
      }
      h1 {
        border-bottom: 4px solid #d5001c;
      }
      /* 2. Rejilla de fotos */
      .grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: 2fr;
      }
      figure {
        margin: 0;
        background-color: white;
        border: 1px solid #000;
        padding: 0.5rem;
      }
      img {
        width: 100%;
      }
      figcaption {
        text-align: center;
        margin-top: 0.4rem;
        font-size: 0.9rem;
        color: #555;
      }
    </style>
  </head>
  <body>
    <h1>Galería de modelos Porsche</h1>
    <section class="grid">
      <!-- Imágenes de Wikimedia Commons -->
      <figure>
        <img
          src="https://commons.wikimedia.org/wiki/Special:FilePath/Porsche_992_Turbo_S_1X7A0413.jpg?width=600"
          alt="Porsche 911 Turbo S"
          width="100%"
        />
        <figcaption>Porsche 911 Turbo S</figcaption>
      </figure>
      <figure>
        <img
          src="https://commons.wikimedia.org/wiki/Special:FilePath/Porsche_Taycan_Sport_Turismo_GTS_1X7A0416.jpg?width=600"
          alt="Porsche Taycan"
        />
        <figcaption>Porsche Taycan</figcaption>
      </figure>
      <figure>
        <img
          src="https://commons.wikimedia.org/wiki/Special:FilePath/2023_Porsche_Cayenne_S_IMG_0521.jpg?width=600"
          alt="Porsche Cayenne"
        />
        <figcaption>Porsche Cayenne</figcaption>
      </figure>
      <figure>
        <img
          src="https://commons.wikimedia.org/wiki/Special:FilePath/Porsche_Macan_4_IMG_2153.jpg?width=600"
          alt="Porsche Macan"
        />
        <figcaption>Porsche Macan</figcaption>
      </figure>
      <figure>
        <img
          src="https://commons.wikimedia.org/wiki/Special:FilePath/Porsche_718_Boxster_GTS_4.0_1X7A0320.jpg?width=600"
          alt="Porsche 718 Boxster"
        />
        <figcaption>Porsche 718 Boxster</figcaption>
      </figure>
      <figure>
        <img
          src="https://commons.wikimedia.org/wiki/Special:FilePath/Porsche_Panamera_(21717).jpg?width=600"
          alt="Porsche Panamera"
        />
        <figcaption>Porsche Panamera</figcaption>
      </figure>
    </section>
  </body>
</html>
