<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Vídeo Porsche Taycan</title>
    <style>
      /* 1. Estilo general */
      body {
        font-family: Arial, sans-serif;
        background-color: #000;
        color: white;
        margin: 1rem;
        text-align: center;
      }
      /* 2. Vídeo */
      video {
        max-width: 100%;
        border: 3px solid #d5001c;
      }
    </style>
  </head>
  <body>
    <h1>Presentación del Porsche Taycan</h1>

    <video controls poster="taycan.jpg">
      <source src="taycan.mp4" type="video/mp4" /> <!--este no va a funcionar porque no tiene archivo, es solo para que se vea que hay un campo de vídeo-->
      <track
        src="sub-es.vtt"
        kind="subtitles"
        srclang="es"
        label="Español"
        default
      />
      <track src="sub-en.vtt" kind="subtitles" srclang="en" label="English" />
      Tu navegador no soporta vídeo HTML5.
    </video>

    <br/>
    <p>También puedes ver el vídeo en YouTube:</p>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/2tt-defZlwE?si=OcAxqCHdTNRW16z9" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
  </body>
</html>
