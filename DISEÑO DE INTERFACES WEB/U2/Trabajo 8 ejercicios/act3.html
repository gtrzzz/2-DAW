<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Gama Porsche</title>
    <style>
      /* 1. Tabla */
      table {
        border-collapse: collapse;
        width: 100%;
        font-family: Arial, sans-serif;
      }
      caption {
        font-weight: bold;
        padding: 0.5rem;
      }
      th,
      td {
        border: 1px solid #000;
        padding: 0.4rem;
        text-align: center;
      }
      /* 2. Cabecera y pie */
      thead th {
        background: #000;
        color: white;
      }
      tfoot td {
        background: #d5001c;
        color: white;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <table>
      <caption>
        Gama Porsche 2025 – potencia en CV
      </caption>

      <thead>
        <tr>
          <th rowspan="2">Tipo</th>
          <th rowspan="2">Modelo</th>
          <th colspan="3">Versión</th>
        </tr>
        <tr>
          <th>Base</th>
          <th>Intermedia</th>
          <th>Tope de gama</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td rowspan="2">Deportivo</td>
          <td>911</td>
          <td>394</td>
          <td>480</td>
          <td>650</td>
        </tr>
        <tr>
          <td>718 Cayman</td>
          <td>300</td>
          <td colspan="2" rowspan="2">350</td>
        </tr>

        <tr>
          <td>SUV</td>
          <td>Cayenne</td>
          <td>353</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td colspan="5">
            Datos orientativos, pueden variar según el mercado
          </td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
