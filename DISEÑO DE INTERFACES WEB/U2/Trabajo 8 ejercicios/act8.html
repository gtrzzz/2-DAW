<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Próximamente – Porsche</title>
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      integrity="sha512-Avb2QiuDEEvB4bZJYdft2mNjVShBftLdPG8FJ0V7irTLQ8Uo0qcPxh4Plq7G5tGm0rU+1SPhVotteLpBERwTkw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      /* 1. Variables */
      :root {
        --prim: #d5001c;
      }
      * {
        box-sizing: border-box;
      }
      /* 2. Estilo general */
      body {
        font-family: "Inter", sans-serif;
        background-color: #000;
        color: white;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        height: 100vh;
        margin: 0;
        padding: 1rem;
      }
      h1 {
        font-size: 3rem;
        margin: 0.5rem 0;
      }
      p {
        font-size: 1.25rem;
        color: #bbb;
        margin: 0 0 1.5rem;
      }
      /* 3. Botón */
      button {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.8rem 1.6rem;
        font-size: 1rem;
        border: none;
        background: var(--prim);
        color: #fff;
        cursor: pointer;
        transition: transform 0.3s;
      }
      button:hover,
      button:focus {
        transform: scale(1.05);
      }
      @media (prefers-reduced-motion: reduce) {
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <h1>El nuevo configurador Porsche está en construcción</h1>
    <p>Déjanos avisarte cuando lancemos&nbsp;🏁</p>
    <button>
      <i class="fa-regular fa-bell"></i>
      Avísame
    </button>
  </body>
</html>
