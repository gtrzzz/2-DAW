<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Reserva de prueba Porsche</title>
    <style>
      /* 1. Estilo general */
      body {
        font-family: Arial, sans-serif;
        background-color: #f2f2f2;
        color: #1a1a1a;
        margin: 1rem;
        max-width: 600px;
      }
      /* 2. Formulario */
      fieldset {
        background-color: white;
        border: 2px solid #000;
        padding: 1rem;
      }
      legend {
        font-weight: bold;
        color: #d5001c;
      }
      label {
        display: block;
        margin-top: 0.7rem;
      }
      input[type="range"] {
        width: 100%;
        accent-color: #d5001c;
      }
      /* 3. Botón */
      button {
        margin-top: 1rem;
        padding: 10px 20px;
        background-color: #d5001c;
        color: white;
        border: none;
      }
    </style>
  </head>
  <body>
    <h1>Reserva tu prueba de conducción Porsche</h1>

    <form action="#" aria-describedby="ayuda-nivel">
      <fieldset border="5">
        <legend>Datos de reserva</legend>

        <label
          >Nombre
          <input type="text" name="nombre" required />
        </label>

        <label
          >E‑mail
          <input type="email" name="email" required />
        </label>

        <label
          >Fecha
          <input type="date" name="fecha" required />
        </label>

        <p>Turno</p>
        <label
          ><input type="radio" name="turno" value="mañana" required />
          Mañana</label
        >
        <label
          ><input type="radio" name="turno" value="tarde" required />
          Tarde</label
        >

        <label
          >Experiencia al volante (1 baja – 10 piloto)
          <input
            type="range"
            name="nivel"
            min="1"
            max="10"
            value="5"
            aria-describedby="ayuda-nivel"
          />
        </label>
        <small id="ayuda-nivel">Selecciona tu experiencia aproximada.</small>

        <label>
          <input type="checkbox" name="seguro" /> Contratar seguro a todo riesgo
          para la prueba
        </label>
      </fieldset>

      <button type="submit">Reservar</button>
    </form>
  </body>
</html>
