<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <form>
      <fieldset>
        <legend>Datos de ejemplo</legend>
        <input list="P1" />
        <datalist id="P1">
          <option value="A">1</option>
          <option value="B" selected>2</option>
        </datalist>

        <br /><br />
        <label>Opt 1</label>
        <input type="radio" value="R1" checked />
        <label>Opt 2</label>
        <input type="radio" value="R2" />

        <label>Opt 3</label>
        <input type="checkbox" checked />
        <label>Opt 4</label>
        <input type="checkbox" />

        <br /><br />
        <label>Numérico</label>
        <input type="number" />

        <br /><br />
        <input type="submit" value="Enviar formulario" />
      </fieldset>

      <br /><br />

      <textarea rows="5" cols="30" placeholder="Escribe aquí..."></textarea>
    </form>

    <br /><br />
    <form>
      <label>Introduce un número entre 10 y 99</label>
      <br />
      <input
        type="number"
        min="10"
        max="99"
        placeholder="Introduce un número"
      />
    </form>

    <h2>Formulario de Contacto</h2>
    <form>
      <input
        name="nombre"
        type="text"
        placeholder="Nombre"
        pattern="[a-zA-Z]{1,40}"
        required
        autofocus
      />
      <input
        name="cp"
        type="text"
        placeholder="Código postal"
        pattern="[0-9]{5}"
        required
      />
      <input
        name="edad"
        type="text"
        pattern="[0-9]{2}"
        placeholder="Edad"
        required
      />

      <input type="color" />
      <input type="date" />
      <input type="email" placeholder="Correo electrónico" required />
      <input type="file" />
      <input type="reset" />
      <button id="enviar" name="enviar" type="submit">ENVIAR</button>
    </form>
  </body>
</html>
